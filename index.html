<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ESMO 2026 議程導航</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f3f0; --surface:#fcfcfb; --card:#ffffff; --ink:#141413; --ink2:#52514e; --ink3:#8a8985;
  --line:#e3e2de; --line2:#d5d4cf; --now:#d93a39; --now-ink:#ffffff;
  --gray-block:#e8e7e3; --gray-border:#d5d4cf; --gray-ink:#6f6e6a;
  --chipbg:#efeeea; --accent:#1f6feb; --shadow:0 1px 3px rgba(0,0,0,.10),0 4px 14px rgba(0,0,0,.06);
  --hdr-bg:rgba(252,252,251,.92);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141413; --surface:#1a1a19; --card:#222221; --ink:#f5f4f0; --ink2:#c3c2b7; --ink3:#8f8e88;
    --line:#33322f; --line2:#413f3b; --now:#ff6b6a; --now-ink:#1a1a19;
    --gray-block:#2c2c2a; --gray-border:#3d3c39; --gray-ink:#a3a29c;
    --chipbg:#2b2b29; --accent:#5ea1ff; --shadow:0 1px 3px rgba(0,0,0,.5);
    --hdr-bg:rgba(20,20,19,.92);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141413; --surface:#1a1a19; --card:#222221; --ink:#f5f4f0; --ink2:#c3c2b7; --ink3:#8f8e88;
  --line:#33322f; --line2:#413f3b; --now:#ff6b6a; --now-ink:#1a1a19;
  --gray-block:#2c2c2a; --gray-border:#3d3c39; --gray-ink:#a3a29c;
  --chipbg:#2b2b29; --accent:#5ea1ff; --shadow:0 1px 3px rgba(0,0,0,.5);
  --hdr-bg:rgba(20,20,19,.92);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  padding-top:calc(54px + env(safe-area-inset-top));
  overflow-x:hidden;
}
.mono{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

/* ---------- fixed header: NOW button pinned top-LEFT ---------- */
.hdr{
  position:fixed; top:0; left:0; right:0; z-index:60;
  display:flex; align-items:center; gap:10px;
  padding:calc(6px + env(safe-area-inset-top)) 10px 6px 10px;
  background:var(--hdr-bg); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
#nowbtn{
  flex:0 0 auto; display:flex; align-items:center; gap:7px;
  min-height:42px; padding:4px 13px 4px 11px; border-radius:21px;
  border:1.5px solid var(--now); background:var(--card); color:var(--ink);
  font:inherit; font-weight:700; cursor:pointer; box-shadow:var(--shadow);
}
#nowbtn:active{transform:scale(.97)}
#nowbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--now);animation:pulse 1.6s ease-out infinite}
#nowbtn.off .dot{animation:none;background:var(--ink3)}
#nowbtn.off{border-color:var(--line2)}
#nowbtn .lbl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.12}
#nowbtn .lbl b{font-size:13.5px}
#nowbtn .lbl span{font-size:11.5px;color:var(--ink2);font-weight:600}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,58,57,.45)}70%{box-shadow:0 0 0 8px rgba(217,58,57,0)}100%{box-shadow:0 0 0 0 rgba(217,58,57,0)}}
.hdr .ttl{flex:1 1 auto; min-width:0}
.hdr .ttl h1{margin:0;font-size:15.5px;line-height:1.2;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl .sub{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#themebtn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:16px;cursor:pointer}

/* ---------- tabs & search ---------- */
.tabs{position:sticky; top:calc(54px + env(safe-area-inset-top)); z-index:50;
  display:flex; gap:6px; padding:8px 10px 0 10px; background:var(--bg);}
.tabs button{
  flex:1 1 0; min-height:40px; padding:7px 4px; font:inherit; font-size:13.5px; font-weight:600;
  color:var(--ink2); background:var(--chipbg); border:1px solid transparent; border-radius:10px 10px 0 0; cursor:pointer;
}
.tabs button[aria-selected="true"]{background:var(--card); color:var(--ink); border-color:var(--line); border-bottom-color:var(--card); box-shadow:var(--shadow)}
.searchrow{position:sticky; top:calc(102px + env(safe-area-inset-top)); z-index:49; padding:8px 10px; background:var(--bg); border-bottom:1px solid var(--line)}
#q{width:100%; min-height:40px; padding:8px 12px; font:inherit; border-radius:10px; border:1px solid var(--line2); background:var(--card); color:var(--ink)}
#q::placeholder{color:var(--ink3)}
main{padding:10px 10px 40px 10px; max-width:1180px; margin:0 auto}
.hidden{display:none!important}

@media (max-width:430px){
  .tabs{gap:4px}
  .tabs button{font-size:12px;padding:6px 2px}
  .hdr .ttl h1{font-size:14px}
  .hdr{gap:7px;padding-left:8px;padding-right:8px}
}

/* ---------- legend / chips ---------- */
.legend{display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin:4px 0 10px 0}
.chip{
  display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:5px 12px;
  border-radius:17px; border:1px solid var(--line2); background:var(--card); color:var(--ink);
  font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; user-select:none;
}
.chip .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.chip[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.chip.count span.n{color:var(--ink2);font-weight:500}
.subchips{display:flex;flex-wrap:wrap;gap:6px;margin:-3px 0 10px 0}
.subchips .chip{min-height:32px;padding:3px 10px;font-size:12px}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;min-height:34px}
.switch input{width:34px;height:20px;appearance:none;background:var(--line2);border-radius:10px;position:relative;cursor:pointer;outline-offset:2px;transition:background .15s;margin:0}
.switch input:checked{background:var(--accent)}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked::after{left:16px}

/* ---------- overview grid ---------- */
.ov-wrap{position:relative;overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface); box-shadow:var(--shadow)}
.ov-grid{display:grid; min-width:100%}
.ov-corner{position:sticky;left:0;z-index:22;background:var(--surface);border-bottom:1px solid var(--line)}
.ov-dayhead{
  text-align:center; padding:7px 2px 3px 2px; border-bottom:1px solid var(--line); border-left:1px solid var(--line);
  font-weight:700; font-size:13px; background:var(--surface);
}
.ov-dayhead .dow{font-size:11px;color:var(--ink2);font-weight:600}
.ov-dayhead.today .dow::after{content:" · 今天";color:var(--now)}
.ov-lanehead{display:flex; border-bottom:1px solid var(--line); border-left:1px solid var(--line); background:var(--surface)}
.ov-lanehead div{flex:1 1 0;text-align:center;font-size:10.5px;color:var(--ink3);padding:1px 0 2px 0;overflow:hidden;white-space:nowrap}
.ov-axis{position:sticky;left:0;z-index:21;background:var(--surface);border-right:1px solid var(--line)}
.ov-axis .hlab{position:absolute;right:5px;transform:translateY(-50%);font-size:10.5px;color:var(--ink3)}
.ov-day{position:relative;border-left:1px solid var(--line);background:var(--surface)}
.ov-day .hline{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line);opacity:.6}
.ov-day .lane-sep{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--line);opacity:.5}
.blk{
  position:absolute; border-radius:4px; overflow:hidden; cursor:pointer;
  font-size:10px; line-height:1.22; font-weight:700; letter-spacing:0;
  padding:2px 2px; -webkit-tap-highlight-color:transparent;
  transition:opacity .15s;
}
.blk .sub{display:block;font-weight:600;font-size:9.5px;opacity:.9}
.blk.gray{background:var(--gray-block); border:1px solid var(--gray-border); color:var(--gray-ink); font-weight:600}
.blk.dim{opacity:.14}
.blk.live{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--now)}
.blk.flash{animation:flash 1s ease-in-out 2}
@keyframes flash{50%{transform:scale(1.06)}}

/* isolate banners: appear only when a filter leaves few blocks (<=14) */
.bnr{
  position:absolute; z-index:15; width:172px; max-width:172px;
  background:var(--card); border:1px solid var(--line); border-left:4px solid var(--ink);
  border-radius:8px; padding:3px 7px; font-size:10.5px; line-height:1.32; color:var(--ink);
  cursor:pointer; box-shadow:var(--shadow);
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.bnr b{font-weight:800}
.bnr .rm{color:var(--ink2);font-weight:600}

/* continuous now line */
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:18;pointer-events:none;transition:top 1s linear}
.nowline::after{content:"";position:absolute;left:-1px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--now)}
.nowtag{
  position:absolute;z-index:23;transform:translateY(-50%);pointer-events:none;
  background:var(--now);color:var(--now-ink);font-size:10.5px;font-weight:700;
  padding:1px 6px;border-radius:8px; left:2px; transition:top 1s linear;
}

/* ---------- cards (timeline / theme / type) ---------- */
.timegrp{margin:14px 0 4px 0}
.timegrp>.gh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.timegrp>.gh .t{font-weight:800;font-size:15px}
.timegrp>.gh .d{color:var(--ink2);font-size:12px}
.badge{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:700}
.badge.live{background:var(--now);color:var(--now-ink)}
.badge.past{background:var(--chipbg);color:var(--ink3)}
.badge.clash{background:transparent;border:1px solid var(--now);color:var(--now)}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; margin:8px 0; box-shadow:var(--shadow); cursor:pointer;
}
.card.dim{opacity:.35}
.card .row1{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:2px}
.card .code{font-weight:800;font-size:13px}
.card .type{font-size:11px;color:var(--ink2);background:var(--chipbg);padding:1px 7px;border-radius:8px}
.card .famtag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px}
.card h3{margin:2px 0 4px 0;font-size:14.5px;line-height:1.4}
.card .meta{font-size:12px;color:var(--ink2)}
.card .talks{margin:6px 0 0 0;padding:6px 0 0 0;border-top:1px dashed var(--line)}
.card .talk{font-size:12px;color:var(--ink2);margin:3px 0;padding-left:10px;text-indent:-10px}
.card .talk b{color:var(--ink);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:6px 0 12px 0}
.tile{border:none;border-radius:14px;padding:14px 12px;color:#fff;font:inherit;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.tile b{font-size:16px;display:block}
.tile span{font-size:12px;opacity:.9}
.tile[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.daychips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px 0}
.empty{color:var(--ink3);text-align:center;padding:30px 0;font-size:13px}
footer{max-width:1180px;margin:24px auto 0 auto;padding:0 12px 26px 12px;font-size:11.5px;color:var(--ink3);line-height:1.6}

/* ---------- bottom sheet ---------- */
#ovl{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
#ovl.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:78vh;overflow-y:auto;
  background:var(--card);border-radius:16px 16px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.25);
  transform:translateY(102%);transition:transform .22s ease-out;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom)) 16px;
}
#sheet.on{transform:none}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 10px auto}
#sheet h2{font-size:16px;margin:4px 0 6px 0;line-height:1.35}
#sheet .meta{font-size:13px;color:var(--ink2);margin:2px 0}
#sheet .sec{font-weight:700;font-size:12.5px;color:var(--ink3);margin:12px 0 4px 0;letter-spacing:.4px}
#sheet .talk{font-size:13px;margin:6px 0;padding-left:12px;text-indent:-12px}
#sheet .talk .sp{color:var(--ink2);font-size:12px}
#sheet .clashbox{border:1px solid var(--now);border-radius:10px;padding:8px 10px;margin-top:8px}
#sheet .clashbox .ci{font-size:12.5px;margin:3px 0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2)}
#sheet .close{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--chipbg);color:var(--ink);font-size:15px;cursor:pointer}
@media (min-width:760px){
  #sheet{left:50%;right:auto;width:640px;transform:translate(-50%,102%)}
  #sheet.on{transform:translate(-50%,0)}
}
</style>
</head>
<body>
<header class="hdr">
  <button id="nowbtn" type="button" aria-label="跳到現在進行中的場次">
    <span class="dot"></span>
    <span class="lbl"><b>即時</b><span class="mono" id="nowclock">--:--</span></span>
  </button>
  <div class="ttl">
    <h1 id="mtg-name"></h1>
    <div class="sub" id="mtg-sub"></div>
  </div>
  <button id="themebtn" type="button" aria-label="切換深淺色">🌓</button>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-ov"    aria-selected="true"  data-v="ov">總覽</button>
  <button role="tab" id="tab-time"  aria-selected="false" data-v="time">時間軸</button>
  <button role="tab" id="tab-theme" aria-selected="false" data-v="theme">主題</button>
  <button role="tab" id="tab-type"  aria-selected="false" data-v="type">類型</button>
</nav>
<div class="searchrow"><input id="q" type="search" autocomplete="off" placeholder="搜尋講題、講者、機構、藥名、房間…"></div>

<main>
  <section id="v-ov" role="tabpanel">
    <div class="legend" id="famlegend"></div>
    <div class="subchips" id="sublegend"></div>
    <div class="ov-wrap" id="ovwrap"><div class="ov-grid" id="ovgrid"></div></div>
  </section>

  <section id="v-time" class="hidden" role="tabpanel">
    <div class="daychips" id="daychips"></div>
    <div id="timeout"></div>
  </section>

  <section id="v-theme" class="hidden" role="tabpanel">
    <div class="tiles" id="famtiles"></div>
    <div class="subchips" id="themesubchips"></div>
    <div id="themeout"></div>
  </section>

  <section id="v-type" class="hidden" role="tabpanel">
    <div class="legend" id="typechips"></div>
    <div id="typeout"></div>
  </section>
</main>

<footer id="foot"></footer>
<div id="ovl"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>

      s+=`--a-${fam}:${PALETTE.anchors[fam][mode]};`;
    }
    return s;
  };
  const st=document.createElement("style");
  st.textContent=`:root{${mk("light")}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${mk("dark")}}}
:root[data-theme="dark"]{${mk("dark")}}`;
  document.head.appendChild(st);
})();
const subVar =k=>{const[f,s]=k.split(":");return`var(--c-${f}-${s})`;};
const subInk =k=>{const[f,s]=k.split(":");return`var(--ci-${f}-${s})`;};

/* ===== venue-local time (IANA tz, DST-proof — never hardcode offsets) ===== */
let _tzOK=true;
function venueNow(){
  const d=new Date();
  try{
    if(_tzOK){
      const p=new Intl.DateTimeFormat("en-CA",{timeZone:CFG.tz,year:"numeric",month:"2-digit",
        day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(d);
      const g=t=>p.find(x=>x.type===t).value;
      const hh=+g("hour")%24, mm=+g("minute"), ss=+g("second");
      return {dateStr:`${g("year")}-${g("month")}-${g("day")}`, hh, mm, ss, minutes:hh*60+mm+ss/60};
    }
  }catch(e){ _tzOK=false; }
  const u=new Date(d.getTime()+(d.getTimezoneOffset()+(CFG.utcOffsetFallbackMin||0))*60000);
  const pad=n=>String(n).padStart(2,"0");
  return {dateStr:`${u.getFullYear()}-${pad(u.getMonth()+1)}-${pad(u.getDate())}`,
          hh:u.getHours(),mm:u.getMinutes(),ss:u.getSeconds(),
          minutes:u.getHours()*60+u.getMinutes()+u.getSeconds()/60};
}
const toMin=t=>{const[a,b]=t.split(":").map(Number);return a*60+b;};
const DOW=["日","一","二","三","四","五","六"];
function dowOf(ds){const[y,m,d]=ds.split("-").map(Number);return DOW[new Date(Date.UTC(y,m-1,d)).getUTCDay()];}
function sessState(s,vn){
  if(s.date!==vn.dateStr) return s.date<vn.dateStr?"past":"future";
  const st=toMin(s.start),en=toMin(s.end);
  return vn.minutes>=en?"past":(vn.minutes>=st?"live":"future");
}

/* ===== derived data ===== */
DATA.forEach((s,i)=>{s._i=i; s._st=toMin(s.start); s._en=toMin(s.end);});
const AX_START=Math.floor((Math.min(...DATA.map(s=>s._st))-20)/30)*30;
const AX_END  =Math.ceil((Math.max(...DATA.map(s=>s._en))+20)/30)*30;
const PX_MIN=1.55, AX_H=(AX_END-AX_START)*PX_MIN;
const yOf=m=>(m-AX_START)*PX_MIN;
const themed=s=>s.themes&&s.themes.fams.length>0;
function clashesOf(s){
  if(!themed(s))return[];
  return DATA.filter(o=>o!==s&&themed(o)&&o.date===s.date&&o._st<s._en&&o._en>s._st);
}
function roomLanes(){
  const lanes=CFG.rooms.slice();
  if(DATA.some(s=>!CFG.rooms.includes(s.venue))) lanes.push("__other__");
  return lanes;
}
function laneKeyOf(s){
  if(CFG.laneMode==="theme") return themed(s)?s.themes.fams[0]:null;
  return CFG.rooms.includes(s.venue)?s.venue:"__other__";
}
function laneList(){ return CFG.laneMode==="theme"?FAMS.slice():roomLanes(); }
function laneLabel(k){
  if(CFG.laneMode==="theme")return FAM_META[k].label.split(" ")[1]||k;
  return k==="__other__"?"其他":(CFG.roomShort&&CFG.roomShort[k])||k.replace(/^Room /,"");
}

/* ===== state ===== */
const S={view:"ov", iso:new Set(), only:false, q:"", themeFam:null, themeSub:null,
        typeSel:null, daySel:null};
try{ S.only=localStorage.getItem("cn_only")==="1"; }catch(e){}

/* ===== helpers ===== */
const $=id=>document.getElementById(id);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function matchQ(s,q){
  if(!q)return true;
  const hay=[s.code,s.topic,s.title,s.venue,s.typeLabel,
    ...(s.talks||[]).flatMap(t=>[t.t,t.n,t.a]),
    ...(s.chairs||[]).flatMap(c=>[c.n,c.a])].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}
function isoPass(s){
  if(S.iso.size===0)return true;
  if(!themed(s))return false;
  for(const k of S.iso){
    if(k.includes(":")){ if(s.themes.subs.includes(k))return true; }
    else if(s.themes.fams.includes(k))return true;
  }
  return false;
}
function visibleInOv(s){
  if(S.only&&!themed(s))return false;
  return true;
}

/* ===== overview ===== */
function buildOverview(){
  const lanes=laneList(), nL=lanes.length, days=CFG.days;
  const g=$("ovgrid");
  /* pass 1: interval-partition every day×lane first, so column widths can follow density
     (theme mode: a family lane with 4 parallel sessions gets 4× the width of an empty one) */
  const MINW=CFG.laneMode==="theme"?44:38, lay={};
  for(const d of days){
    const byLane=new Map();
    for(const s of DATA){
      if(s.date!==d)continue;
      const lk=laneKeyOf(s); if(lk===null)continue;
      const li=lanes.indexOf(lk); if(li<0)continue;
      if(!byLane.has(li))byLane.set(li,[]);
      byLane.get(li).push(s);
    }
    const laneCols=lanes.map(()=>1), placed=[];
    for(const[li,list]of byLane){
      const sorted=list.slice().sort((a,b)=>a._st-b._st||a._en-b._en);
      const colsEnd=[];
      const items=sorted.map(s=>{
        let c=colsEnd.findIndex(e=>e<=s._st);
        if(c<0){c=colsEnd.length;colsEnd.push(0);}
        colsEnd[c]=s._en;
        return{s,col:c};
      });
      laneCols[li]=Math.max(1,colsEnd.length);
      for(const it of items)placed.push({s:it.s,li,col:it.col});
    }
    const offs=[]; let acc=0; for(const c of laneCols){offs.push(acc);acc+=c;}
    lay[d]={placed,laneCols,offs,total:acc};
  }
  g.style.gridTemplateColumns=`44px ${days.map(d=>`minmax(${Math.max(200,lay[d].total*MINW)}px,1fr)`).join(" ")}`;
  let h=`<div class="ov-corner"></div>`;
  const vn=venueNow();
  for(const d of days){
    const today=d===vn.dateStr?" today":"";
    h+=`<div class="ov-dayhead${today}"><div>${d.slice(5).replace("-","/")}</div><div class="dow">週${dowOf(d)}</div>
        <div class="ov-lanehead" style="border:none;grid-template-columns:${lay[d].laneCols.map(c=>c+"fr").join(" ")}">${lanes.map((k,i)=>`<div style="flex:${lay[d].laneCols[i]} 1 0">${esc(laneLabel(k))}</div>`).join("")}</div></div>`;
  }
  h+=`<div class="ov-axis" style="height:${AX_H}px;position:sticky">`;
  for(let m=Math.ceil(AX_START/60)*60;m<=AX_END;m+=60)
    h+=`<div class="hlab" style="top:${yOf(m)}px">${String(m/60).padStart(2,"0")}</div>`;
  h+=`</div>`;
  for(const d of days){
    h+=`<div class="ov-day" data-day="${d}" style="height:${AX_H}px">`;
    for(let m=Math.ceil(AX_START/60)*60;m<=AX_END;m+=60)
      h+=`<div class="hline" style="top:${yOf(m)}px"></div>`;
    const L=lay[d];
    for(let i=1;i<nL;i++)h+=`<div class="lane-sep" style="left:${(100*L.offs[i]/L.total).toFixed(3)}%"></div>`;
    for(const{s,li,col}of L.placed){
      const top=yOf(s._st), ht=Math.max((s._en-s._st)*PX_MIN-2,14);
      const l=100*(L.offs[li]+col)/L.total, w=100/L.total;
      let style=`top:${top}px;height:${ht}px;left:calc(${l.toFixed(3)}% + 1.5px);width:calc(${w.toFixed(3)}% - 3px);`;
      let cls="blk", inner="";
      if(themed(s)){
        const subs=[...new Set(s.themes.fams.map(f=>{
          const inFam=s.themes.subs.filter(k=>k.startsWith(f+":"));
          return inFam.includes(s.themes.primary)?s.themes.primary:inFam[0];
        }))];
        if(subs.length>=2){
          style+=`background:linear-gradient(90deg,${subVar(subs[0])} 0 50%,${subVar(subs[1])} 50% 100%);color:${subInk(subs[0])};`;
        }else{
          style+=`background:${subVar(subs[0])};color:${subInk(subs[0])};`;
        }
        const chip=SUB_META[s.themes.primary]?SUB_META[s.themes.primary].chip:"";
        inner=ht>=30?`${esc(s.code)}<span class="sub">${esc(chip)}</span>`:(ht>=17?esc(s.code):"");
      }else{
        cls+=" gray";
        inner=ht>=17?esc(s.code):"";
      }
      h+=`<div class="${cls}" data-code="${esc(s.code)}" style="${style}" title="${esc(s.code+" "+(s.topic||s.title))}">${inner}</div>`;
    }
    if(d===vn.dateStr) h+=`<div class="nowline" data-nl="${d}" style="top:${yOf(Math.min(Math.max(vn.minutes,AX_START),AX_END))}px"></div>`;
    h+=`</div>`;
  }
  g.innerHTML=h;
  const todayCol=g.querySelector(`.ov-day[data-day="${vn.dateStr}"]`);
  if(todayCol){
    const tag=document.createElement("div"); tag.id="nowtag"; tag.className="nowtag mono";
    g.querySelector(".ov-axis").appendChild(tag);
  }
  g.querySelectorAll(".blk").forEach(b=>b.addEventListener("click",()=>openSheet(b.dataset.code)));
  paintOverviewState();
}
function paintOverviewState(){
  const vn=venueNow();
  document.querySelectorAll("#ovgrid .blk").forEach(b=>{
    const s=DATA.find(x=>x.code===b.dataset.code);
    const show=visibleInOv(s);
    b.style.display=show?"":"none";
    if(!show)return;
    const pass=isoPass(s)&&matchQ(s,S.q);
    b.classList.toggle("dim",!pass);
    b.classList.toggle("live",sessState(s,vn)==="live");
  });
  renderBanners();
}
function renderBanners(){
  document.querySelectorAll("#ovgrid .bnr").forEach(e=>e.remove());
  // banners appear ONLY for sub-level (specific cancer-type) selections —
  // family-level isolate (whole GI / whole GU) and plain search stay banner-free.
  const subKeys=[...S.iso].filter(k=>k.includes(":"));
  if(subKeys.length===0)return;
  const grid=$("ovgrid");
  const matches=[];
  grid.querySelectorAll(".blk").forEach(b=>{
    if(b.style.display==="none"||b.classList.contains("dim"))return;
    const s=DATA.find(x=>x.code===b.dataset.code);
    if(s&&themed(s)&&s.themes.subs.some(k=>subKeys.includes(k)))matches.push({b,s});
  });
  if(!matches.length)return;
  // --- placement in GRID coordinates: banners can cross day columns, so the
  // collision space must be grid-wide (per-day lists caused cross-column overlaps) ---
  const AXIS_W=46;
  const gridW=grid.scrollWidth;
  const hit=(a,r)=>!(a.l+a.w<=r.l||a.l>=r.l+r.w||a.t+a.h<=r.t||a.t>=r.t+r.h);
  const obstacles=matches.map(({b})=>{
    const d=b.parentElement;
    return{l:d.offsetLeft+b.offsetLeft,t:b.offsetTop,w:b.offsetWidth,h:b.offsetHeight};
  });
  const placed=[];
  matches.sort((a,b)=>
    (a.b.parentElement.offsetLeft-b.b.parentElement.offsetLeft)||
    (a.b.offsetTop-b.b.offsetTop)||(a.b.offsetLeft-b.b.offsetLeft));
  for(const{b,s}of matches){
    const day=b.parentElement;
    const e=document.createElement("div");
    e.className="bnr"; e.dataset.code=s.code;
    e.style.borderLeftColor=themed(s)?subVar(s.themes.primary):"var(--gray-border)";
    const room=(CFG.roomShort&&CFG.roomShort[s.venue])||s.venue;
    const topic=(s.topic||s.title||"");
    e.innerHTML=`<b>${esc(s.code)}</b> ${esc(topic.length>46?topic.slice(0,46)+"…":topic)} <span class="rm mono">· ${esc(room)} ${s.start}</span>`;
    day.appendChild(e);
    const W=e.offsetWidth||172, H=e.offsetHeight||34, dayH=day.offsetHeight;
    const gl=day.offsetLeft+b.offsetLeft, gt=b.offsetTop, bw=b.offsetWidth, bh=b.offsetHeight;
    const clampT=t=>Math.max(2,Math.min(t,dayH-H-2));
    // candidate ladder: right/left side × head/tail alignment (右齊頭→右齊尾→左齊頭→左齊尾)
    const cands=[
      {l:gl+bw+4,t:clampT(gt)},
      {l:gl+bw+4,t:clampT(gt+bh-H)},
      {l:gl-W-4,t:clampT(gt)},
      {l:gl-W-4,t:clampT(gt+bh-H)},
    ].filter(c=>c.l>=AXIS_W&&c.l+W<=gridW);
    let pos=cands.find(c=>{
      const r={l:c.l,t:c.t,w:W,h:H};
      return !obstacles.some(o=>hit(r,o))&&!placed.some(o=>hit(r,o));
    });
    if(!pos){
      // fallback: stay on whichever side fits the grid and slide down past whatever
      // is in the way; residual overlap is acceptable (banner stays tappable)
      const side=(gl+bw+4+W<=gridW)?gl+bw+4:Math.max(AXIS_W,gl-W-4);
      let t=clampT(gt);
      for(let guard=0;guard<40;guard++){
        const r={l:side,t,w:W,h:H};
        const c=[...obstacles,...placed].find(o=>hit(r,o));
        if(!c||t>=dayH-H-2)break;
        t=clampT(c.t+c.h+3);
      }
      pos={l:side,t};
    }
    e.style.left=(pos.l-day.offsetLeft)+"px"; e.style.top=pos.t+"px";
    placed.push({l:pos.l,t:pos.t,w:W,h:H});
    e.addEventListener("click",()=>openSheet(s.code));
  }
}
let _bnrRs=null;
window.addEventListener("resize",()=>{clearTimeout(_bnrRs);_bnrRs=setTimeout(renderBanners,200);});

/* ===== legends ===== */
function buildLegends(){
  const fl=$("famlegend");
  let h="";
  for(const f of FAMS){
    const n=DATA.filter(s=>themed(s)&&s.themes.fams.includes(f)).length;
    h+=`<button class="chip count" data-iso="${f}" aria-pressed="false">
        <span class="sw" style="background:var(--a-${f})"></span>${FAM_META[f].label} <span class="n">${n}</span></button>`;
  }
  h+=`<span class="chip count" style="cursor:default"><span class="sw" style="background:var(--gray-block);border:1px solid var(--gray-border)"></span>其他 <span class="n">${DATA.filter(s=>!themed(s)).length}</span></span>`;
  h+=`<label class="switch"><input type="checkbox" id="onlysw" ${S.only?"checked":""}>只看三主題</label>`;
  fl.innerHTML=h;
  fl.querySelectorAll("button.chip").forEach(c=>c.addEventListener("click",()=>toggleIso(c.dataset.iso)));
  $("onlysw").addEventListener("change",e=>{S.only=e.target.checked; saveOnly(); paintOverviewState();});
  refreshLegend();
}
function saveOnly(){ try{localStorage.setItem("cn_only",S.only?"1":"0");}catch(e){} }
function toggleIso(k){
  if(S.iso.has(k))S.iso.delete(k);
  else{
    if(k.includes(":")){ S.iso.delete(k.split(":")[0]); }
    else{ for(const x of[...S.iso])if(x.startsWith(k+":"))S.iso.delete(x); }
    S.iso.add(k);
  }
  refreshLegend(); paintOverviewState();
  if(S.iso.size>0)revealFirstMatch();
}
function revealFirstMatch(){
  if(S.view!=="ov")return;
  const list=DATA.filter(s=>themed(s)&&isoPass(s)&&matchQ(s,S.q)&&visibleInOv(s))
                 .sort((a,b)=>a.date.localeCompare(b.date)||a._st-b._st);
  if(!list.length)return;
  const grid=$("ovgrid"), wrap=$("ovwrap");
  const b=grid.querySelector(`.blk[data-code="${list[0].code}"]`);
  if(!b)return;
  const day=b.parentElement;
  wrap.scrollTo({left:Math.max(0,Math.min(day.offsetLeft-46,wrap.scrollWidth-wrap.clientWidth)),behavior:"smooth"});
  const abs=wrap.getBoundingClientRect().top+window.scrollY+day.offsetTop+b.offsetTop;
  if(abs<window.scrollY+170||abs>window.scrollY+window.innerHeight-140)
    window.scrollTo({top:Math.max(0,abs-window.innerHeight*0.35),behavior:"smooth"});
}
function refreshLegend(){
  document.querySelectorAll("#famlegend button.chip").forEach(c=>{
    c.setAttribute("aria-pressed",S.iso.has(c.dataset.iso)?"true":"false");
  });
  const famSel=[...S.iso].filter(k=>!k.includes(":"));
  const subSel=[...S.iso].filter(k=>k.includes(":"));
  const showFor=new Set([...famSel,...subSel.map(k=>k.split(":")[0])]);
  const sl=$("sublegend");
  if(showFor.size===0){ sl.innerHTML=""; return; }
  let h="";
  for(const f of FAMS){
    if(!showFor.has(f))continue;
    for(const sub in PALETTE.families[f].light){
      const key=`${f}:${sub}`;
      const n=DATA.filter(s=>themed(s)&&s.themes.subs.includes(key)).length;
      if(n===0)continue;
      h+=`<button class="chip" data-iso="${key}" aria-pressed="${S.iso.has(key)}">
          <span class="sw" style="background:${subVar(key)}"></span>${SUB_META[key].label} <span class="n">${n}</span></button>`;
    }
  }
  sl.innerHTML=h;
  sl.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>toggleIso(c.dataset.iso)));
}

/* ===== shared card ===== */
function famTagsHtml(s){

      const n=DATA.filter(s=>themed(s)&&s.themes.subs.includes(key)).length;
      if(!n)continue;
      h+=`<button class="chip" data-k="${key}" aria-pressed="${S.themeSub===key}"><span class="sw" style="background:${subVar(key)}"></span>${SUB_META[key].label} <span class="n">${n}</span></button>`;
    }
    sc.innerHTML=h;
    sc.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
      S.themeSub=S.themeSub===c.dataset.k?null:c.dataset.k; buildThemeView();
    }));
  }else sc.innerHTML="";
  let list=DATA.filter(s=>themed(s)&&matchQ(s,S.q));
  if(S.themeSub)list=list.filter(s=>s.themes.subs.includes(S.themeSub));
  else if(S.themeFam)list=list.filter(s=>s.themes.fams.includes(S.themeFam));
  list.sort((a,b)=>a.date.localeCompare(b.date)||a._st-b._st);
  $("themeout").innerHTML=list.map(s=>cardHtml(s,vn)).join("")||`<div class="empty">無符合場次</div>`;
  bindCards($("themeout"));
}

/* ===== type view ===== */
function buildTypeView(){
  const vn=venueNow();
  const types=[...new Set(DATA.map(s=>s.typeLabel))];
  const tc=$("typechips");
  tc.innerHTML=types.map(t=>{
    const n=DATA.filter(s=>s.typeLabel===t).length;
    return`<button class="chip count" data-t="${esc(t)}" aria-pressed="${S.typeSel===t}">${esc(t)} <span class="n">${n}</span></button>`;
  }).join("");
  tc.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
    S.typeSel=S.typeSel===c.dataset.t?null:c.dataset.t; buildTypeView();
  }));
  let list=DATA.filter(s=>matchQ(s,S.q));
  if(S.typeSel)list=list.filter(s=>s.typeLabel===S.typeSel);
  list.sort((a,b)=>a.date.localeCompare(b.date)||a._st-b._st);
  $("typeout").innerHTML=list.map(s=>cardHtml(s,vn)).join("")||`<div class="empty">無符合場次</div>`;
  bindCards($("typeout"));
}

/* ===== bottom sheet ===== */
function openSheet(code){
  const s=DATA.find(x=>x.code===code); if(!s)return;
  const vn=venueNow();
  const cl=clashesOf(s);
  const chairs=(s.chairs||[]).map(c=>`${esc(c.n)}（${esc(c.a)}）`).join("、");
  const panels=(s.panels||[]).map(c=>esc(c.n)).join("、");
  const talks=(s.talks||[]).map(t=>{
    const chips=(t.themes||[]).map(k=>SUB_META[k]?` <span class="famtag" style="background:${subVar(k)};color:${subInk(k)}">${SUB_META[k].chip}</span>`:"").join("");
    return`<div class="talk">· <b>${esc(t.t)}</b>${chips}<br><span class="sp">${esc(t.n)}${t.a?"｜"+esc(t.a):""}${t.c?"｜"+esc(t.c):""}</span></div>`;
  }).join("");
  const st=sessState(s,vn);
  $("sheet").innerHTML=`<div class="grab"></div><button class="close" aria-label="關閉">✕</button>
    <div class="row1" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span class="code" style="font-weight:800">${esc(s.code)}</span>
      <span class="type" style="font-size:11px;background:var(--chipbg);padding:1px 7px;border-radius:8px">${esc(s.typeLabel)}</span>
      ${famTagsHtml(s)}${st==="live"?'<span class="badge live">進行中</span>':""}
    </div>
    <h2>${esc(s.topic||s.title)}</h2>
    <div class="meta mono">${s.date} (週${dowOf(s.date)}) ${s.start}–${s.end}（${esc(CFG.tzLabel)}時間）</div>
    <div class="meta">📍 ${esc(s.venue)}</div>
    ${s.desc?`<div class="sec">簡介</div><div style="font-size:13px;color:var(--ink2)">${esc(s.desc)}</div>`:""}
    ${chairs?`<div class="sec">主持</div><div style="font-size:13px">${chairs}</div>`:""}
    ${panels?`<div class="sec">與談</div><div style="font-size:13px">${panels}</div>`:""}
    ${talks?`<div class="sec">講題</div>${talks}`:""}
    ${cl.length?`<div class="clashbox"><b style="font-size:12.5px;color:var(--now)">⚠️ 同時段三主題衝堂</b>${cl.map(c=>`<div class="ci" data-code="${esc(c.code)}">${esc(c.code)} ${esc((c.topic||c.title).slice(0,40))}（${esc(c.venue)}）</div>`).join("")}</div>`:""}`;
  $("sheet").querySelector(".close").addEventListener("click",closeSheet);
  $("sheet").querySelectorAll(".ci").forEach(c=>c.addEventListener("click",()=>openSheet(c.dataset.code)));
  $("ovl").classList.add("on"); $("sheet").classList.add("on");
}
function closeSheet(){ $("ovl").classList.remove("on"); $("sheet").classList.remove("on"); }
$("ovl").addEventListener("click",closeSheet);

/* ===== view switching / search / theme toggle ===== */
function show(view){
  S.view=view;
  for(const v of["ov","time","theme","type"]){
    $("v-"+v).classList.toggle("hidden",v!==view);
    $("tab-"+v).setAttribute("aria-selected",v===view?"true":"false");
  }
  if(view==="ov"){paintOverviewState();tickOverview();}
  if(view==="time")buildTimeView();
  if(view==="theme")buildThemeView();
  if(view==="type")buildTypeView();
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.v)));
$("q").addEventListener("input",e=>{
  S.q=e.target.value.trim();
  if(S.view==="ov")paintOverviewState(); else show(S.view);
});
$("themebtn").addEventListener("click",()=>{
  const r=document.documentElement;
  const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const nx=cur==="dark"?"light":"dark";
  r.setAttribute("data-theme",nx);
  try{localStorage.setItem("cn_theme",nx);}catch(e){}
});
try{const t=localStorage.getItem("cn_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}

/* ===== NOW button ===== */
function goNow(){
  const vn=venueNow();
  show("ov");
  const wrap=$("ovwrap"), grid=$("ovgrid");
  const col=grid.querySelector(`.ov-day[data-day="${vn.dateStr}"]`);
  if(!col){ // outside conference days → just show overview top
    window.scrollTo({top:0,behavior:"smooth"}); return;
  }
  const colX=col.offsetLeft-44;
  wrap.scrollTo({left:Math.max(0,colX-10),behavior:"smooth"});
  const y=wrap.getBoundingClientRect().top+window.scrollY+col.offsetTop+yOf(Math.min(Math.max(vn.minutes,AX_START),AX_END));
  window.scrollTo({top:Math.max(0,y-window.innerHeight*0.38),behavior:"smooth"});
  DATA.filter(s=>sessState(s,vn)==="live").forEach(s=>{
    const b=grid.querySelector(`.blk[data-code="${s.code}"]`);
    if(b){b.classList.remove("flash");void b.offsetWidth;b.classList.add("flash");}
  });
}
$("nowbtn").addEventListener("click",goNow);

/* ===== clock / tick ===== */
function tick(){
  const vn=venueNow();
  $("nowclock").textContent=`${String(vn.hh).padStart(2,"0")}:${String(vn.mm).padStart(2,"0")} ${CFG.tzLabel}`;
  const inConf=CFG.days.includes(vn.dateStr);
  const btn=$("nowbtn");
  btn.classList.toggle("off",!inConf);
  btn.querySelector(".lbl b").textContent=inConf?"即時":(vn.dateStr<CFG.days[0]?"未開始":"已結束");
  tickOverview();
  if(S.view==="ov"){
    const grid=$("ovgrid");
    grid.querySelectorAll(".blk").forEach(b=>{
      const s=DATA.find(x=>x.code===b.dataset.code);
      if(s)b.classList.toggle("live",sessState(s,vn)==="live");
    });
  }
}

/* ===== boot ===== */
$("mtg-name").textContent=CFG.name;
$("mtg-sub").textContent=`${CFG.days[0].slice(5).replace("-","/")}–${CFG.days[CFG.days.length-1].slice(5).replace("-","/")} · ${CFG.venueName}（以${CFG.tzLabel}當地時間為準）`;
$("foot").innerHTML=`${esc(CFG.fullName)}<br>資料來源：${esc(CFG.source)}（擷取於 ${esc(CFG.dataAsOf)}）；現場臨時異動以會場公告為準。<br>主題色塊：GI 綠 / GU 橘 / Sarcoma 紫，深淺區分癌別；灰色為其他主題場次。時間軸紅線＝${esc(CFG.tzLabel)}當地現在時刻。`;
buildLegends();
buildOverview();
show("ov");
(function(){
  const vn=venueNow();
  const col=$("ovgrid").querySelector(`.ov-day[data-day="${vn.dateStr}"]`);
  if(col)$("ovwrap").scrollLeft=Math.max(0,col.offsetLeft-46);
})();
tick();
setInterval(tick,1000);
</script>
